[pytest]
# Default: fan out across cores via pytest-xdist.
# Policy: W = nproc-2 (leave 2 free). Override only with explicit -n 0 / -n 1
# for a single debugging test — never for the full suite.
addopts =
    -n 86
    -q
    --tb=line
# BLAS must stay single-threaded *per worker* (set in shell / conftest),
# otherwise 86 workers × multi-thread BLAS oversubscribe.
filterwarnings =
    ignore::DeprecationWarning
