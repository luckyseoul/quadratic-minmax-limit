[pytest]
# Default: run without pytest-xdist so the suite works out of the box.
# For parallel runs with xdist installed, use: pytest -n auto
pythonpath = src
testpaths = tests
addopts =
    -q
    --tb=line
# BLAS must stay single-threaded *per worker* (set in shell / conftest),
# otherwise workers x multi-thread BLAS oversubscribe.
filterwarnings =
    ignore::DeprecationWarning
